[package]
name = "gambiit-app"
version = "0.1.0"
edition = "2024"
description = "Gambiit desktop chess game"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gambiit-core = { path = "../crates/gambiit-core" }
gambiit-agent = { path = "../crates/gambiit-agent" }
gambiit-engine = { path = "../crates/gambiit-engine" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
shakmaty = "0.30.2"
axum = "0.8"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
async-stream = "0.3"
futures-util = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
