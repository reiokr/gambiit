[package]
name = "gambiit-app"
version = "0.1.0"
edition = "2024"
description = "Gambiit desktop chess game"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gambiit-core = { path = "../crates/gambiit-core" }
gambiit-agent = { path = "../crates/gambiit-agent" }
gambiit-engine = { path = "../crates/gambiit-engine" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
shakmaty = "0.30.2"
