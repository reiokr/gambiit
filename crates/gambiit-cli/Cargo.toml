[package]
name = "gambiit-cli"
version = "0.1.0"
edition = "2024"
description = "Terminal prototype for Gambiit"
license = "MIT"
repository = "https://github.com/reiokr/gambiit"

[dependencies]
gambiit-core = { path = "../gambiit-core" }
gambiit-engine = { path = "../gambiit-engine" }
gambiit-agent = { path = "../gambiit-agent" }
shakmaty = "0.30.2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
